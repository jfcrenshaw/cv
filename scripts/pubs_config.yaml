# Configuration for scripts/build_cv_pubs.py, which builds sections/publications.tex
# (and sections/pubstats.tex) from my ADS library.
#
# Quoting: LaTeX is fine in unquoted or 'single-quoted' strings.
# Avoid "double quotes" around anything with a backslash, since YAML treats \ as an escape there.
# Quote any string that contains ": " (e.g., titles with a colon).

# ADS library code, from https://ui.adsabs.harvard.edu/user/libraries/<LIB_CODE>
library: p11_8_nYTjuAD1LbKfZC5g

# My name as printed (in bold) in the CV, and the variants ADS may use for me
name: Crenshaw J. F.
name_variations:
  - Crenshaw, John Franklin
  - Crenshaw, John F.
  - Crenshaw, J. F.
  - Crenshaw, JF
  - Crenshaw J. F.
  - Crenshaw JF
  - John Franklin Crenshaw
  - John F. Crenshaw
  - J. F. Crenshaw
  - JF Crenshaw
  - Crenshaw, John
  - Crenshaw, J.
  - Crenshaw, J
  - Crenshaw J.
  - Crenshaw J
  - John Crenshaw
  - J. Crenshaw
  - J Crenshaw

# Papers are sorted into sections by author position; "overrides" (DOIs) force a section
sections:
  primary:
    title: 'First Author:'
  secondary:
    title: 'Co-Author with Major Contributions:'
    overrides:
      - 10.71929/RUBIN/2571480     # DP1 photo-z technote
      - 10.48550/arXiv.2505.02928  # RAIL paper
      - 10.48550/arXiv.2603.23786  # DP1 paper
      - 10.1093/mnras/stad302      # SCOTCH paper (Lokken)
      - 10.48550/arXiv.2601.10797  # Crafford paper
  tertiary:
    title: 'Other Co-Author Papers:'
    intro: >-
      Includes papers on which my authorship reflects smaller contributions,
      data collection or calibration, or my Rubin and DESC Builder status,
      as well as white papers.

# DOIs hidden from the list (their citations still count toward the totals)
hide:
  - 10.71929/RUBIN/2570536     # RTN-095, duplicate of the DP1 paper
  - 10.48550/arXiv.2104.08229  # arXiv version of the ApJS information-metric paper

# Most significant papers (ADS bibcodes), starred in the list
highlight:
  - 2025ApJS..281...54C  # u-band survey strategy and LBGs
  - 2026ApJ..1009L..13C  # DP1 circumgalactic dust
  - 2024AJ....168...80C  # PZFlow

# "My role" notes printed under papers, keyed by DOI
contributions:
  10.1093/mnras/stag1012: Built the reference sample and its Euclid cross-match.  # DP1 photo-z (Zhang)
  10.48550/arXiv.2505.02928: >-  # RAIL paper (arXiv)
    Led development of RAIL's forward-modeling (creation) module:
    normalizing flows, photometric error models, and spectroscopic degradations.
  10.33232/001c.158200: >-  # RAIL paper (OJAp)
    Led development of RAIL's forward-modeling (creation) module:
    normalizing flows, photometric error models, and spectroscopic degradations.
  10.1093/mnras/stae2519: >-  # Spatial variability paper (Hang)
    Developed PhotErr and the RAIL forward-modeling tools used to propagate depth variations.
  10.3847/1538-4365/ad7d07: >-  # Information metric (ApJS, Malz)
    Created PZFlow, used in this work to estimate the information metric with conditional normalizing flows.
  10.3847/1538-4357/ad6cdc: >-  # AOS degeneracy paper (Megias Homar)
    Helped devise the SVD control strategy and its weighting by impact on image quality.
  10.48550/arXiv.2603.23786: >-  # DP1 paper (arXiv)
    Ran and optimized the active optics system to focus and collimate the telescope during the observations.
  10.3847/1538-3881/ae521f: >-  # DP1 paper (AJ)
    Ran and optimized the active optics system to focus and collimate the telescope during the observations.
  10.48550/arXiv.2601.10797: Created PZFlow, used in this work to model photo-$z$ biases.  # Crafford
  10.1088/1538-3873/ac59bf: Created PZFlow, used in this work to model photo-$z$ biases.  # Stylianou
  10.3847/2041-8213/ad4039: Created PZFlow, used in this work to generate the augmented training galaxies.  # Moskowitz
  10.1093/mnras/stad302: Created PZFlow, used in this work to model correlated host-galaxy properties.  # SCOTCH

# Papers not yet in ADS, listed after the first-author papers (not counted in the statistics)
